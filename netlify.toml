# /api 交给真实后端处理，避免被 SPA 重定向吞掉
[[redirects]]
  from = "/api/*"
  to = "/index.html"
  status = 404
# Netlify build & deploy configuration
[build]
  command = "npm install && npm run build"
  publish = "dist"

# SPA routing for React Router (client-side routes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# VITE_API_BASE 指向 CloudBase 后端（Netlify 环境变量）
